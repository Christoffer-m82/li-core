[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "li-os-profile-service"
version = "0.1.0"
description = "Private owner profile-photo service foundation for Li OS"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.35,<3.0",
    "google-cloud-storage>=2.18,<4.0",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1.0",
]

[tool.setuptools]
py-modules = [
    "asgi_adapter",
    "decoder_process",
    "decoder_worker",
    "gcs_object_store",
    "google_identity",
    "google_storage_binding",
    "http_contract",
    "image_normalize",
    "object_repository",
    "profile_application",
    "profile_state",
    "upload_input",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
