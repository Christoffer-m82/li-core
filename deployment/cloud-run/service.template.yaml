apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: li-os
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 120
      serviceAccountName: LI_RUNTIME_SERVICE_ACCOUNT
      containers:
        - image: LI_CONTAINER_IMAGE
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 1
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
            timeoutSeconds: 2
            periodSeconds: 30
          env:
            - name: LI_OS_ENVIRONMENT
              value: production
            - name: LI_OS_LOG_LEVEL
              value: INFO
            - name: LI_OS_DB_PORT
              value: "5432"
            - name: LI_OS_DB_NAME
              value: postgres
            - name: LI_OS_DB_SSLMODE
              value: require
            - name: LI_OS_RATE_LIMIT_REQUESTS
              value: "120"
            - name: LI_OS_RATE_LIMIT_WINDOW_SECONDS
              value: "60"
            - name: LI_OS_TRUST_PROXY_HEADERS
              value: "true"
            - name: LI_OS_CLAUDE_MODEL
              value: claude-sonnet-5
            # Add non-secret configuration and Secret Manager references at deploy time.
            # Never put secret values in this file.
