[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "li-os-backend"
version = "0.1.0"
description = "Private backend and Memory API for Li OS"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "anthropic>=0.120,<1.0",
    "PyYAML>=6,<7",
    "httpx>=0.27,<1.0",
    "google-cloud-storage>=2.18,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
