```yaml
version: "0.1"
status: "foundational"

system:
  name: "Li OS Memory Permissions"
  owner: "Christoffer"

  purpose: >
    Define which Li OS agents may access, receive, propose changes to,
    or administer different categories of Christoffer's personal memory.

core_principles:

  default_deny:
    description: >
      An agent should not receive personal information unless that information
      is relevant to the agent's role or the current task.

  minimum_necessary:
    description: >
      When information is shared with a specialist, Li should provide the
      minimum amount of personal context reasonably necessary to perform
      the task well.

  purpose_limitation:
    description: >
      Memory accessed for one task should not automatically become available
      for unrelated purposes.

  sensitivity_matters:
    description: >
      Higher-sensitivity information requires stricter access controls,
      narrower sharing, and stronger auditability.

  li_is_context_router:
    description: >
      Li is the primary agent responsible for determining what context should
      be supplied to specialist agents.

  no_free_cross_agent_sharing:
    description: >
      Specialist agents should not freely share personal information with
      one another. Cross-agent context should normally pass through Li.

  owner_authority:
    description: >
      Christoffer retains ultimate authority over personal memory permissions
      and may grant, restrict, or revoke access.

  third_party_privacy:
    description: >
      Information about other people should be shared only when relevant and
      should receive additional protection when sensitive.

access_levels:

  none:
    description: >
      No access to the memory domain.

  task_specific:
    description: >
      Access only to information explicitly provided or retrieved for the
      current task.

  summary:
    description: >
      Access to a limited summary rather than full underlying records.

  restricted:
    description: >
      Access to relevant records within the domain when required by the
      agent's role.

  broad:
    description: >
      Broad access to the domain because it is necessary for the agent's
      primary responsibilities.

  administrative:
    description: >
      Access required to maintain, secure, classify, audit, or operate the
      memory system. Administrative access does not imply unrestricted use
      of the information for unrelated reasoning.

sensitivity_access:

  low:
    default_rule: "available_when_relevant"

  personal:
    default_rule: "available_to_authorized_agents_when_relevant"

  sensitive:
    default_rule: "restricted_and_task_relevant"

  highly_sensitive:
    default_rule: "explicitly_authorized_or_strictly_required"

  secret:
    default_rule: "never_exposed_to_normal_agents"

secret_rules:

  prohibited_agent_access:
    - li
    - sofia
    - marco
    - elena
    - amelia
    - freja
    - oliver
    - james
    - victor
    - nora
    - milo
    - iris
    - clara
    - ada
    - theo

  handling:
    description: >
      Passwords, API keys, private cryptographic keys, recovery codes,
      and equivalent secrets should be handled by dedicated secure credential
      systems rather than exposed as conversational memory.

  heimdall:
    access: "metadata_only"
    description: >
      Heimdall may know that a secret exists, which system uses it,
      whether it is healthy, and when it was rotated, but should not normally
      receive the raw secret value.

domains:

  identity:
    description: >
      Core facts about Christoffer such as background, language, places lived,
      and ordinary biographical information.

  people:
    description: >
      Information about people in Christoffer's life.

  family:
    description: >
      Family relationships, history, events, and responsibilities.

  parenting:
    description: >
      Parenting, children, co-parenting, activities, and related logistics.

  relationships:
    description: >
      Romantic relationships, friendships, interpersonal history,
      and private relationship context.

  dating:
    description: >
      Dating experiences, preferences, conversations, and current situations.

  preferences:
    description: >
      General likes, dislikes, tastes, and lifestyle preferences.

  values:
    description: >
      Personal principles, priorities, and things Christoffer considers
      important.

  goals:
    description: >
      Short-term and long-term personal goals.

  health:
    description: >
      Health history, symptoms, medications, medical context, and health data.

  fitness:
    description: >
      Training history, exercise, recovery, performance, and physical goals.

  nutrition:
    description: >
      Dietary habits, food preferences, nutrition goals, and cooking context.

  wellbeing:
    description: >
      Stress, emotional wellbeing, routines, habits, and mental performance.

  work:
    description: >
      Professional role, projects, career information, and work context.

  work_confidential:
    description: >
      Confidential business information, internal strategy, contracts,
      customer information, company-sensitive material, or privileged
      professional context.

  finance:
    description: >
      Personal financial information, assets, liabilities, budgets,
      investments, and financial plans.

  legal:
    description: >
      Personal legal matters, legal documents, disputes, obligations,
      and legal history.

  travel:
    description: >
      Travel history, preferences, plans, bookings, and destination context.

  home:
    description: >
      Residence, home projects, design preferences, plants, garden,
      possessions, and household context.

  leisure:
    description: >
      Restaurants, entertainment, hobbies, events, interests, and experiences.

  social:
    description: >
      Friends, social activities, invitations, groups, and social preferences.

  commitments:
    description: >
      Promises, deadlines, obligations, and planned actions.

  decisions:
    description: >
      Important decisions, options, reasoning, recommendations, and outcomes.

  timeline:
    description: >
      Chronological life history and important events.

  documents:
    description: >
      Metadata and summaries relating to personal documents.

  lessons:
    description: >
      Lessons learned from decisions, recommendations, and outcomes.

  open_loops:
    description: >
      Unresolved matters, waiting items, and things requiring follow-up.

