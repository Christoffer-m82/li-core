task_context_rules:

  creation:
    description: >
      Before delegating a task, Li should construct a task context package.

  package_should_include:
    - task_objective
    - relevant_personal_context
    - necessary_live_information
    - permitted_memory_domains
    - sensitivity_level
    - expected_output
    - whether_independent_analysis_is_required

  package_should_not_include:
    - unrelated_private_history
    - irrelevant_health_information
    - irrelevant_financial_information
    - unrelated_relationship_information
    - secrets
    - unnecessary_third_party_information

cross_agent_sharing:

  default: "through_li"

  allowed_without_li:
    - >
      System-level technical metadata explicitly designed for machine-to-machine
      operation and containing no unnecessary personal information.

  sensitive_information:
    rule: >
      Sensitive or highly sensitive personal information should not be passed
      directly between specialist agents unless Li or an approved system policy
      explicitly authorizes the transfer.

  example:
    scenario: >
      Sofia identifies that a health limitation should affect Christoffer's
      exercise plan.

    allowed_share:
      from: "sofia"
      through: "li"
      to: "marco"
      information: >
        Only the medically relevant exercise restriction or recommendation.

    prohibited_share:
      information: >
        Sofia's complete health record or unrelated medical history.

temporary_access:

  principle: >
    Li may grant an agent temporary access to information outside its normal
    domain when required for a specific task.

  requirements:
    - access_must_be_task_relevant
    - scope_should_be_minimized
    - highly_sensitive_access_should_be_logged
    - access_should_expire_after_task_or_defined_window
    - permanent_permission_should_not_be_created_automatically

owner_overrides:

  christoffer_may:
    - grant_agent_access
    - revoke_agent_access
    - grant_temporary_access
    - restrict_li_access_where_technically_possible
    - prevent_specific_memories_from_being_shared
    - mark_information_private_to_li
    - request_access_history
    - request_permission_audit

  explicit_private_to_li:
    description: >
      Christoffer may mark a memory as private to Li. Such information should
      not be disclosed to specialist agents unless Christoffer later authorizes
      sharing or an overriding safety requirement applies.

third_party_information:

  principle: >
    Li OS should recognize that personal memory frequently contains information
    about people other than Christoffer.

  rules:
    - >
      Store third-party information only when reasonably useful for
      Christoffer's life, responsibilities, or relationships.
    - >
      Do not store speculative accusations or sensitive interpretations as
      confirmed facts.
    - >
      Sensitive information about children should receive heightened
      protection.
    - >
      Do not expose private third-party information to unrelated agents.
    - >
      Minimize retention of highly sensitive information that provides little
      continuing value.

audit:

  log_when:
    - highly_sensitive_memory_is_accessed
    - temporary_permission_is_granted
    - agent_permission_is_changed
    - sensitive_information_is_shared_cross_agent
    - bulk_memory_export_occurs
    - memory_is_deleted
    - security_policy_blocks_access

  audit_record:
    fields:
      - timestamp
      - agent
      - action
      - memory_domain
      - reason
      - authorization_basis
      - sensitivity
      - result

  privacy:
    description: >
      Audit logs should avoid duplicating full sensitive memory content when
      metadata is sufficient.

permission_changes:

  process:
    - proposed_change
    - heimdall_security_review
    - impact_assessment
    - christoffer_approval_if_material
    - version_control_update
    - deployment
    - audit_entry

  rule: >
    A new agent should begin with the minimum permissions required for its
    defined role.

emergency_and_safety:

  principle: >
    Permission boundaries should remain strong during urgent situations,
    but Li may use already-authorized relevant information when necessary to
    provide timely safety guidance.

  restrictions:
    - >
      Urgency does not grant unrestricted access to every memory domain.
    - >
      External disclosure of sensitive information should still follow
      applicable authorization and safety requirements.

review_policy:

  frequency: "quarterly_or_after_major_system_change"

  reviewed_by:
    - li
    - theo
    - heimdall
    - ada

  review_questions:
    - "Does every agent still need its current access?"
    - "Are any permissions unnecessarily broad?"
    - "Have new memory domains been introduced?"
    - "Are sensitive domains adequately protected?"
    - "Are temporary permissions expiring correctly?"
    - "Has any agent repeatedly requested information outside its role?"
    - "Do new tools or capabilities create new privacy risks?"

update_integrity:

  rule: >
    Li OS updates must not silently broaden agent memory access.

  required_checks:
    - compare_permissions_before_and_after
    - flag_new_access
    - flag_new_write_permissions
    - flag_new_cross_agent_routes
    - flag_new_sensitive_data_access
    - require_review_for_material_changes
