name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-components:
    name: ${{ matrix.component }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend
          - native-gateway
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: ${{ matrix.component }}/uv.lock

      - name: Install component and development dependencies
        run: uv sync --locked --extra dev
        working-directory: ${{ matrix.component }}

      - name: Lint
        run: uv run --locked ruff check app tests
        working-directory: ${{ matrix.component }}

      - name: Test
        run: uv run --locked pytest
        working-directory: ${{ matrix.component }}
        env:
          # Synthetic values make backend test collection independent of a local
          # .env file. They are not credentials and cannot access external systems.
          LI_OS_ENVIRONMENT: development
          LI_OS_API_TOKEN: ci-synthetic-api-token
          LI_OS_THEO_API_TOKEN: ci-synthetic-theo-token
          LI_OS_OWNER_API_TOKEN: ci-synthetic-owner-token
          LI_OS_ANTHROPIC_API_KEY: ci-synthetic-anthropic-key
          LI_OS_DB_HOST: test.invalid
          LI_OS_DB_USER: li_backend_runtime.ci
          LI_OS_DB_PASSWORD: ci-synthetic-runtime-password
          LI_OS_THEO_DB_USER: li_theo_runtime.ci
          LI_OS_THEO_DB_PASSWORD: ci-synthetic-theo-password
          LI_OS_OWNER_DB_USER: li_owner_runtime.ci
          LI_OS_OWNER_DB_PASSWORD: ci-synthetic-owner-password

      - name: Test browser voice runtime
        if: matrix.component == 'frontend'
        run: node --test tests-js/*.test.mjs
        working-directory: frontend

      - name: Compile
        run: uv run --locked python -m compileall -q app
        working-directory: ${{ matrix.component }}

  repository-audit:
    name: Repository secret and file audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Reject tracked secret files and high-confidence credentials
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [pathlib.Path(name) for name in tracked if name]

          forbidden_suffixes = {".key", ".p12", ".pem", ".pfx"}
          forbidden_paths = []
          findings = []

          patterns = {
              "GitHub personal access token": re.compile(("gh" + "p_") + r"[A-Za-z0-9]{36}"),
              "GitHub fine-grained token": re.compile(
                  ("github" + "_pat_") + r"[A-Za-z0-9_]{60,}"
              ),
              "AWS access key": re.compile(("AK" + "IA") + r"[A-Z0-9]{16}"),
              "Google API key": re.compile(("AI" + "za") + r"[A-Za-z0-9_-]{35}"),
              "private key block": re.compile("-----BEGIN " + "(?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          }

          for path in tracked:
              normalized = path.as_posix()
              lowered_parts = {part.lower() for part in path.parts}
              lowered_name = path.name.lower()
              is_environment_file = lowered_name == ".env" or lowered_name.startswith(".env.")
              is_example = lowered_name.endswith(".example")
              is_credentials_file = lowered_name.endswith(
                  ("credentials.json", "credentials.yaml", "credentials.yml")
              )

              if (
                  (is_environment_file and not is_example)
                  or is_credentials_file
                  or path.suffix.lower() in forbidden_suffixes
                  or "secrets" in lowered_parts
                  or "credentials" in lowered_parts
              ):
                  forbidden_paths.append(normalized)

              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\0" in data:
                  continue
              text = data.decode("utf-8", errors="replace")
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f"{normalized}: {label}")

          if forbidden_paths or findings:
              if forbidden_paths:
                  print("Tracked files violate the secret-file policy:")
                  for name in forbidden_paths:
                      print(f"- {name}")
              if findings:
                  print("Potential credentials detected (values are intentionally not printed):")
                  for finding in findings:
                      print(f"- {finding}")
              raise SystemExit(1)

          print(f"Audited {len(tracked)} tracked files; no prohibited secret files or credential patterns found.")
          PY

      - name: Reject mutable workflow action references
        run: |
          python - <<'PY'
          import pathlib
          import re

          mutable = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = re.match(r"\s*(?:-\s*)?uses:\s*([^#\s]+)", line)
                  if not match:
                      continue
                  reference = match.group(1)
                  if reference.startswith(("./", "docker://")):
                      continue
                  revision = reference.rsplit("@", 1)[-1]
                  if not re.fullmatch(r"[0-9a-f]{40}", revision):
                      mutable.append(f"{path}:{line_number}: {reference}")

          if mutable:
              print("Workflow actions must use immutable 40-character commit SHAs:")
              for finding in mutable:
                  print(f"- {finding}")
              raise SystemExit(1)

          print("All external workflow actions use immutable commit SHAs.")
          PY

      - name: Reject mutable workflow container images
        run: |
          python - <<'PY'
          import pathlib
          import re

          mutable = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = re.match(r"\s*(?:image|container):\s*([^#\s]+)", line)
                  if match and not re.search(r"@sha256:[0-9a-f]{64}$", match.group(1)):
                      mutable.append(f"{path}:{line_number}: {match.group(1)}")

          if mutable:
              print("Workflow container images must use immutable SHA-256 digests:")
              for finding in mutable:
                  print(f"- {finding}")
              raise SystemExit(1)

          print("All workflow container images use immutable SHA-256 digests.")
          PY

  profile-photo-foundation:
    name: Profile photo Linux boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: profile-service/uv.lock

      - name: Install locked service and development dependencies
        run: uv sync --locked --extra dev
        working-directory: profile-service

      - name: Lint profile service
        run: uv run --locked ruff check .
        working-directory: profile-service

      - name: Test Linux process and image boundaries
        run: uv run --locked pytest
        working-directory: profile-service

      - name: Compile profile foundation
        run: uv run --locked python -m compileall -q .
        working-directory: profile-service

  container-builds:
    name: ${{ matrix.component }} container build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend
          - native-gateway
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build locked production image
        run: |
          docker build \
            --file ${{ matrix.component }}/Dockerfile \
            --tag li-os-${{ matrix.component }}:ci \
            .
          docker run --rm --entrypoint python li-os-${{ matrix.component }}:ci \
            -c "import importlib.util, os, shutil, sys; import fastapi, uvicorn; assert sys.executable == '/app/.venv/bin/python'; assert os.geteuid() != 0; assert shutil.which('uv') is None; assert importlib.util.find_spec('pytest') is None"

  migration-integration:
    name: Disposable database migration checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: ci-synthetic-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: li_os_kr011_acceptance
      PGUSER: supabase_admin
      PGPASSWORD: ci-synthetic-postgres-password
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Create isolated acceptance database
        run: |
          psql --no-psqlrc --set ON_ERROR_STOP=1 --command "CREATE DATABASE li_os_kr011_acceptance;"
          psql --no-psqlrc --set ON_ERROR_STOP=1 --dbname li_os_kr011_acceptance \
            --command "GRANT CREATE ON DATABASE li_os_kr011_acceptance TO postgres; GRANT CREATE ON SCHEMA public TO postgres;"
        env:
          PGDATABASE: postgres
          PGUSER: supabase_admin

      - name: Apply and audit migration history
        run: python memory/tests/validate_migrations.py

      - name: Install locked backend acceptance dependencies
        run: uv sync --locked --extra dev
        working-directory: backend

      - name: Run synthetic application/database privacy and recovery acceptance
        run: uv run --locked pytest tests/test_local_acceptance_harness.py -q
        working-directory: backend
        env:
          LI_OS_SYNTHETIC_ACCEPTANCE: "1"
          LI_OS_ENVIRONMENT: development
          LI_OS_API_TOKEN: ci-synthetic-api-token
          LI_OS_THEO_API_TOKEN: ci-synthetic-theo-token
          LI_OS_OWNER_API_TOKEN: ci-synthetic-owner-token
          LI_OS_ANTHROPIC_API_KEY: ci-synthetic-provider-disabled
          LI_OS_BRAVE_SEARCH_API_KEY: ""
          LI_OS_GOOGLE_CALENDAR_CLIENT_ID: ""
          LI_OS_GOOGLE_CALENDAR_CLIENT_SECRET: ""
          LI_OS_GOOGLE_CALENDAR_REFRESH_TOKEN: ""
          LI_OS_GOOGLE_GMAIL_CLIENT_ID: ""
          LI_OS_GOOGLE_GMAIL_CLIENT_SECRET: ""
          LI_OS_GOOGLE_GMAIL_REFRESH_TOKEN: ""
          LI_OS_DB_HOST: localhost
          LI_OS_DB_PORT: "5432"
          LI_OS_DB_NAME: li_os_kr011_acceptance
          LI_OS_DB_USER: li_backend_runtime
          LI_OS_DB_PASSWORD: ci-synthetic-backend-password
          LI_OS_DB_SSLMODE: disable
          LI_OS_THEO_DB_USER: li_theo_runtime
          LI_OS_THEO_DB_PASSWORD: ci-synthetic-theo-password
          LI_OS_OWNER_DB_USER: li_owner_runtime
          LI_OS_OWNER_DB_PASSWORD: ci-synthetic-owner-password

  android-native:
    name: Android native checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1

      - name: Verify locked Android dependency graph
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          :app:dependencies --quiet > "$RUNNER_TEMP/li-android-dependencies.txt"
        working-directory: native/android

      - name: Compile and test Android library
        run: ./gradlew --no-daemon --dependency-verification strict testDebugUnitTest
        working-directory: native/android

  ios-native:
    name: iOS native checks
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify pinned Xcode toolchain
        run: |
          version="$(xcodebuild -version | head -n 1)"
          printf '%s\n' "$version"
          test "$version" = "Xcode 16.4"

      - name: Compile iOS package
        run: >-
          xcodebuild build
          -scheme LiNativePOC
          -destination "generic/platform=iOS"
          CODE_SIGNING_ALLOWED=NO
        working-directory: native/ios

      - name: Test package with Mac Catalyst
        run: >-
          xcodebuild test
          -scheme LiNativePOC
          -destination "platform=macOS,variant=Mac Catalyst"
          CODE_SIGNING_ALLOWED=NO
        working-directory: native/ios
