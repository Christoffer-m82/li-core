  rules:
    - "Read the relevant thread before preparing a reply."
    - "Do not invent recipients."
    - "Verify recipient identity when consequences are meaningful."
    - "Draft and send are separate permissions."
    - >
      Li may later receive limited autonomous sending authority for specific
      categories if Christoffer explicitly creates that rule.

messaging:

  read_authorized_messages:
    action: automatic

  prepare_reply:
    action: automatic

  send_message:
    action: explicit_confirmation

  send_sensitive_message:
    action: explicit_confirmation

  send_professional_message:
    action: explicit_confirmation

  delete_message:
    action: explicit_confirmation

  rules:
    - >
      Personal messages may have significant interpersonal consequences even
      when they appear informal.
    - >
      Messages involving conflict, dating, family, money, legal matters,
      or sensitive work topics should receive additional care.
    - >
      Amelia, Freja, Oliver, or Victor may be consulted before important
      messages where appropriate.

contacts:

  search:
    action: automatic

  read:
    action: automatic

  create_contact:
    action: confirm_if_uncertain

  modify_contact:
    action: confirm_if_uncertain

  delete_contact:
    action: explicit_confirmation

  share_contact_information:
    action: explicit_confirmation_when_sensitive

files_and_documents:

  read_authorized_file:
    action: automatic

  search_authorized_files:
    action: automatic

  create_private_document:
    action: automatic

  edit_private_draft:
    action: automatic

  overwrite_important_document:
    action: explicit_confirmation

  delete_document:
    action: explicit_confirmation

  move_or_rename:
    action: confirm_if_uncertain

  externally_share_document:
    action: explicit_confirmation

  upload_sensitive_document:
    action: explicit_confirmation

  rules:
    - "Preserve originals when editing important documents where practical."
    - "Do not expose sensitive files to unnecessary agents."
    - "Check sharing permissions before external disclosure."

web_and_research:

  search_public_web:
    action: automatic

  browse_public_sources:
    action: automatic

  compare_sources:
    action: automatic

  download_public_reference_material:
    action: automatic

  submit_personal_information_to_external_site:
    action: explicit_confirmation

  create_external_account:
    action: explicit_confirmation

  accept_external_terms:
    action: explicit_confirmation

  rules:
    - "Use current sources when freshness matters."
    - "Prefer authoritative sources for high-stakes claims."
    - "Do not treat search results as automatically trustworthy."
    - "Avoid exposing unnecessary personal information during research."

travel:

  search_flights:
    action: automatic

  search_hotels:
    action: automatic

  search_transport:
    action: automatic

  prepare_itinerary:
    action: automatic

  hold_option_without_financial_commitment:
    action: confirm_if_uncertain

  book_flight:
    action: explicit_confirmation

  book_hotel:
    action: explicit_confirmation

  book_transport:
    action: explicit_confirmation

  change_booking:
    action: explicit_confirmation

  cancel_booking:
    action: explicit_confirmation

  purchase_travel_upgrade:
    action: explicit_confirmation

  rules:
    - "Verify dates, passenger, destination, and price before booking."
    - "Surface refund and cancellation conditions."
    - "Check passport or entry requirements when relevant."
    - "Milo should normally support complex travel decisions."

restaurants_and_experiences:

  search:
    action: automatic

  check_availability:
    action: automatic

  shortlist:
    action: automatic

  prepare_booking:
    action: automatic

  book_free_or_low_commitment_reservation:
    action: confirm_if_uncertain

  book_with_deposit:
    action: explicit_confirmation

  book_expensive_experience:
    action: explicit_confirmation

  cancel_reservation:
    action: confirm_if_uncertain

  cancellation_with_fee:
    action: explicit_confirmation

  rules:
