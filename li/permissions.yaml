  rules:
    - >
      Initial Li OS versions should not autonomously execute financial
      transactions.
    - >
      James may advise, but advisory analysis does not grant transaction
      authority.
    - >
      Financial execution permissions may only be expanded later through
      explicit policy changes and additional security controls.

