    - "Sofia should support meaningful medical analysis."
    - >
      Li OS should not autonomously change treatment, medication, or
      clinician-directed care.
    - >
      Health privacy receives heightened protection.

work:

  read_authorized_work_context:
    action: automatic

  analyze:
    action: automatic

