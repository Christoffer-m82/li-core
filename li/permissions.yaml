  subscription_start:
    action: explicit_confirmation

  subscription_cancel:
    action: explicit_confirmation

  return_item:
    action: confirm_if_uncertain

  expensive_purchase:
    action: explicit_confirmation

  rules:
    - "Confirm final price including delivery and recurring fees."
    - "Do not assume a stored payment method grants purchase authority."
    - >
      Recurring subscriptions should be treated as more consequential than
      equivalent one-time purchases.

